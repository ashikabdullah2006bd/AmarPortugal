<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmarPortugal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--g:#0F6B4F;--gd:#0A4F3A;--bg:#F2F8F4;--wh:#fff;--ink:#1B2B25;--mu:#5F6F68;--ln:#D7E5DC;--tb:#EAF3FD;--to:#FFF3E0;--tp:#FDEEF3;--tm:#E6F5EC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}h1,h2,h3{margin:0;line-height:1.2}
.w{max-width:1040px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 18px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;text-decoration:none;color:var(--g)}
.logo i{font-style:normal;background:var(--g);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:14px}
.nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.nav a{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;padding:6px 14px;border-radius:99px;color:#2B3A34}
.nav a.on,.nav a:hover{background:#DDF3E8;color:var(--g)}
.act{display:flex;gap:10px;align-items:center}.btn:not(.o){background:#0A5C45;border-color:#0A5C45}
.btn,button{font:inherit;font-weight:600;cursor:pointer;border:1.5px solid var(--g);background:var(--g);color:#fff;border-radius:99px;padding:7px 18px;text-decoration:none;display:inline-block;font-size:15px}
.btn.o,button.o{background:#fff;color:var(--g)}
select,input[type=text],input[type=email],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.act select{width:auto;padding:6px 8px}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
/* EASY CUSTOMIZATION: change hero colours here */
.hero{position:relative;min-height:max(550px,calc(100vh - 70px));padding:50px 0 0;background:linear-gradient(180deg,#E6F4EC,var(--bg));background-size:cover;background-position:center bottom;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center}
.hw{position:relative;max-width:880px;width:100%;margin:0 auto;padding:0 18px}
.bdg{background:#CFF1E2;color:#0A5C45;border-radius:99px;padding:6px 16px;font-size:13px;font-weight:700;display:inline-block;margin-bottom:20px}
.hero h1{font-size:clamp(32px,5.2vw,50px);font-weight:800;line-height:1.15;letter-spacing:-.5px;position:relative;z-index:1;max-width:820px;margin:0 auto 14px;color:#0E3B30}.hl{color:#0A7A58;position:relative;display:inline-block}.hl::after{content:"";position:absolute;bottom:3px;left:0;width:100%;height:4px;background:#F2B8C0;border-radius:2px;z-index:-1}
.hero p{color:#5F6F68;font-size:17px;margin:0 auto 24px;max-width:560px}.hero .btn{padding:11px 24px;font-size:15px;font-weight:700}.hero .btn:not(.o){box-shadow:0 8px 18px rgba(10,92,69,.2)}.hero .btn.o{border:1px solid #8CCBB4;color:#0A5C45}.hero .btn.o:hover{border-color:#0A5C45;background:#F0FDF7}.hero .btn+.btn{margin-left:10px}.hero .portugal-modern-skyline{margin-top:auto;align-self:stretch}
.vid{aspect-ratio:16/10;border-radius:18px;background:linear-gradient(135deg,#1F8A66,#0F6B4F);display:grid;place-items:center;color:#fff;text-align:center;padding:12px;font-size:14px;box-shadow:0 8px 24px rgba(15,107,79,.18)}
.vid b{display:block;font-size:38px}
.s{padding:34px 0}h2{font-size:25px;margin-bottom:4px}.lead{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:block;border:1px solid var(--ln);border-radius:16px;padding:16px;text-decoration:none;background:var(--wh)}
.card:hover{border-color:var(--g)}.card h3{font-size:17px;margin-bottom:4px}.card p{margin:0;color:var(--mu);font-size:14px}
.go{background:var(--tb)}.book{background:var(--to)}.fun{background:var(--tp)}.info{background:var(--tm)}
.st{display:inline-block;margin-top:8px;font-size:12px;padding:2px 10px;border-radius:99px;background:#fff;color:var(--g);font-weight:600}
.ban{border:1px dashed #B9D4C5;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff}
.tag{font-size:12px;color:var(--mu)}
.bld{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;align-items:start}
.pn,.stg{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:#fff;color:var(--g);padding:7px 8px}.tabs button.on{background:var(--g);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--ln);background:var(--tm);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.cnt{font-weight:700;color:var(--g)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.th{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--ln)}.th.on{box-shadow:0 0 0 3px var(--g)}
canvas{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:12px;border:1px solid var(--ln);cursor:pointer}
.lnk{background:none;border:0;color:var(--g);text-decoration:underline;padding:0;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.pg{padding:30px 0;min-height:60vh}.box{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;max-width:520px}
ul.l{padding-left:20px}ul.l li{margin:5px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:120px}
.day{border-top:1px solid var(--ln);padding:10px 0}
.note{font-size:13px;color:var(--mu);margin-top:12px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.stamp{border:2px dashed #C8D6CD;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:14px;font-weight:700;font-size:14px;color:#9AA9A1;background:#fff;line-height:1.2}
.stamp.on{border:3px solid var(--g);color:var(--g);background:var(--tm);transform:rotate(-6deg)}
.cover{background:linear-gradient(135deg,#0F6B4F,#0A4F3A);color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}.cover h2{margin:4px 0;font-size:28px}.cover small{letter-spacing:.12em;opacity:.8}.cover .rk{display:inline-block;margin-top:6px;background:#fff;color:var(--g);border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px}
.pbar{height:10px;background:#D7E5DC;border-radius:99px;margin:14px 0;overflow:hidden}.pbar i{display:block;height:100%;background:var(--g)}
.ds{background:#fff;border:1px solid var(--ln);border-radius:14px;margin:8px 0;padding:0 14px}.ds summary{cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:10px;font-weight:600}.ds .ct{color:var(--g);font-weight:700}.ds[open]{background:var(--tm)}.ds .tools{margin-top:0}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0 24px}.sc{background:#fff;border:1px solid var(--ln);border-left:5px solid var(--g);border-radius:14px;padding:16px;text-align:center}.sc small{display:block;color:var(--mu)}.sc b{font-size:28px}
.brow{display:grid;grid-template-columns:minmax(110px,220px) 1fr 64px;gap:10px;align-items:center;margin:9px 0;font-size:14px}.brow b{text-align:right}.bt{background:#E6F2EA;border-radius:99px;height:16px;overflow:hidden}.bt i{display:block;height:100%;border-radius:99px}
.card .btn{margin-top:12px;font-size:14px;padding:6px 14px}
.hc{display:flex;gap:12px;border:1px dashed #B9D4C5;border-radius:14px;padding:12px;background:#fff;margin-top:10px}.hi{width:84px;height:84px;border-radius:10px;background:var(--tm);display:grid;place-items:center;font-size:30px;flex-shrink:0}.hc s{color:#8A9A92}.hc .pr{color:#B91C1C;font-size:18px;font-weight:700}
.vc{background:linear-gradient(135deg,#0F6B4F,#0A4F3A);color:#fff;border-radius:18px;padding:20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;max-width:460px}.qr{display:grid;grid-template-columns:repeat(10,8px);gap:1px;background:#fff;padding:6px;border-radius:8px}.qr span{width:8px;height:8px;background:#fff}.qr span.on{background:#0A4F3A}
.dy{border-left:3px solid var(--g);padding-left:14px;margin:0 0 18px}.dy h3{color:var(--g);font-size:17px;margin-bottom:6px}
/* Modern Portugal skyline (your design) */
.portugal-modern-skyline{position:relative;width:100%;height:260px;margin-top:40px;background:linear-gradient(180deg,rgba(248,250,252,0) 0%,#e2e8f0 100%);overflow:hidden;border-top:1px solid #cbd5e1}
.skyline-row{position:absolute;bottom:60px;width:100%;height:140px;display:flex;align-items:flex-end;justify-content:flex-end;padding-right:5%;gap:40px;pointer-events:none;z-index:1}
.lisbon-bridge{position:absolute;left:5%;bottom:15px;width:320px;height:90px;display:flex;align-items:flex-end}
.bridge-pillar{width:12px;height:85px;background-color:#94a3b8;margin:0 80px;position:relative;border-radius:2px 2px 0 0;box-shadow:-4px 0 0 0 #64748b inset}
.lisbon-bridge::before{content:'';position:absolute;top:20px;left:0;width:100%;height:40px;border-bottom:3px solid #64748b;border-radius:0 0 50% 50%/0 0 100% 100%}
.lisbon-bridge::after{content:'';position:absolute;bottom:25px;left:0;width:100%;height:5px;background-color:#475569}
.pena-palace{width:90px;height:120px;background-color:#94a3b8;position:relative;border-radius:6px 6px 0 0;box-shadow:-15px 0 0 0 #64748b inset;margin-left:360px}
.pena-palace::before{content:'';position:absolute;top:-25px;left:15px;width:35px;height:60px;background-color:#64748b;border-radius:50% 50% 0 0;box-shadow:-8px 0 0 0 #475569 inset}
.discoveries-ship{width:75px;height:105px;background:linear-gradient(135deg,#cbd5e1 0%,#94a3b8 100%);clip-path:polygon(0% 100%,75% 100%,100% 75%,65% 35%,85% 0%,25% 15%)}
.belem-fortress{width:90px;height:70px;background-color:#94a3b8;border-radius:4px 4px 0 0;box-shadow:-20px 0 0 0 #64748b inset;position:relative}
.belem-fortress::after{content:'';position:absolute;top:-20px;left:12px;width:22px;height:20px;background-color:#64748b;box-shadow:-5px 0 0 0 #475569 inset}
.sea-cliff-lighthouse{width:100px;height:60px;background-color:#64748b;clip-path:polygon(0% 100%,100% 100%,80% 30%,40% 10%,10% 40%);position:relative}
.sea-cliff-lighthouse::before{content:'';position:absolute;top:-35px;right:25px;width:14px;height:45px;background-color:#94a3b8;box-shadow:-4px 0 0 0 #475569 inset;border-radius:2px}
.metro-track-line{position:absolute;bottom:63px;width:100%;height:6px;background:linear-gradient(180deg,#94a3b8 0%,#475569 100%);z-index:2}
.modern-metro-train{position:absolute;bottom:68px;left:-300px;width:240px;height:38px;display:flex;gap:3px;z-index:3;animation:modernMetroDrive 18s cubic-bezier(0.25,1,0.5,1) infinite}
.metro-engine-front{flex:1;background:linear-gradient(135deg,#cbd5e1 0%,#94a3b8 100%);border:2px solid #1e293b;border-radius:0 18px 4px 0;position:relative;box-shadow:inset 0 4px 0 #fff}
.metro-engine-front::after{content:'';position:absolute;top:4px;right:4px;width:18px;height:14px;background-color:#1e293b;border-radius:0 8px 2px 0}
.metro-cabin{flex:1.2;background:linear-gradient(180deg,#cbd5e1 0%,#94a3b8 100%);border:2px solid #1e293b;border-radius:3px;display:flex;align-items:center;justify-content:space-around;padding:0 4px;box-shadow:inset 0 4px 0 #fff;position:relative}
.metro-cabin::before,.metro-engine-front::before{content:'';position:absolute;bottom:6px;left:0;width:100%;height:4px;background-color:#0284c7}
.cabin-window{width:14px;height:10px;background-color:#1e293b;border-radius:2px;margin-top:-6px}
@keyframes modernMetroDrive{0%{left:-300px}85%{left:100%}100%{left:100%}}
.ocean-base{position:absolute;bottom:0;left:0;width:100%;height:75px;background:#0f172a;z-index:4}
.animated-waves{position:absolute;bottom:70px;left:0;width:200%;height:18px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 100" preserveAspectRatio="none"><path fill="%230f172a" d="M0,40 C320,90 420,10 720,40 C1020,70 1120,10 1440,40 L1440,100 L0,100 Z"/></svg>') repeat-x;animation:waveFlow 14s linear infinite;z-index:3}
@keyframes waveFlow{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@media (max-width:700px){.lisbon-bridge{display:none}.pena-palace{margin-left:0}.skyline-row{transform:scale(.7);transform-origin:bottom right}}
@media (prefers-reduced-motion:reduce){.modern-metro-train,.animated-waves{animation:none}.modern-metro-train{left:30%}}

/* Hero illustration (matches reference design) */
.hero.himg{min-height:max(560px,39vw);padding:44px 0 0;background-color:#DDF5F2;background-size:cover;background-position:center bottom;background-repeat:no-repeat;justify-content:flex-start}
.hero.himg .hw{max-width:900px}
.hero.himg .bdg{background:#BFEBDD;color:#0A5C45;padding:7px 18px;margin-bottom:22px}
.hero.himg h1{font-size:clamp(34px,4.6vw,58px);font-weight:800;line-height:1.14;letter-spacing:-.8px;color:#0B3D31;max-width:860px}
.hero.himg .hl{color:#0A7A58}.hero.himg .hl::after{height:3px;bottom:2px;background:#F4B6C0}
.hero.himg p{color:#5B6B66;font-size:17px;max-width:540px;margin-bottom:26px}
header{border-bottom:0;box-shadow:0 1px 0 rgba(15,107,79,.08)}
.nav a.on{background:#DDF3E8}
@media (max-width:700px){.hero.himg{min-height:620px;background-position:40% bottom}.hero.himg h1{font-size:30px}}
/* Trip planner */
.tph2{background:linear-gradient(135deg,#fff 0%,#EAF6F0 70%,#E4F2FB 100%);border:1px solid var(--ln);border-radius:24px;padding:26px 30px;margin-bottom:18px}
.tph2 h2{font-size:clamp(30px,4.4vw,44px);font-weight:800;letter-spacing:-.6px;color:#0B3D31;margin:0 0 6px}.tph2 p{color:var(--mu);margin:0 0 16px;max-width:560px}
.tabs2{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--ln);border-radius:99px;padding:4px;flex-wrap:wrap}.tabs2 button{background:transparent;color:var(--ink);border:0;padding:10px 20px;font-size:15px}.tabs2 button.on{background:var(--g);color:#fff}
.tpg{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}.tsum{position:sticky;top:84px}
.dc{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:6px}.dh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dh b{font-size:17px;color:var(--g)}.dh select{flex:1;min-width:160px;width:auto}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pl{text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--ln);border-radius:12px;padding:9px 12px;font-weight:500;font-size:14px;display:flex;gap:8px;align-items:center;line-height:1.3}.pl.on{background:var(--tm);border-color:var(--g)}.pl.on::after{content:"✓";margin-left:auto;color:var(--g);font-weight:800}
.add{width:100%;background:#fff;color:var(--g);border:2px dashed #8CCBB4;border-radius:16px;padding:14px;font-size:16px;margin-top:6px}
.lg{margin:8px 0;padding:5px 12px;background:var(--tm);border-radius:99px;font-size:13px;color:#2B3A34;display:inline-block}.mp{text-decoration:none;font-size:13px}
.sd{margin:10px 0}.sd ul{margin:4px 0}.tip{background:var(--to);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}
.chat{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;max-width:780px;margin:0 auto}.msgs{max-height:480px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.m{padding:10px 14px;border-radius:16px;max-width:90%}.m.b{background:var(--tm)}.m.u{background:var(--g);color:#fff;align-self:flex-end}.m p{margin:0 0 8px}.m ul{margin:4px 0 8px;padding-left:18px}
.pd{margin:8px 0;padding:8px 12px;background:#fff;border-left:4px solid var(--g);border-radius:10px;font-size:14px}.chat .chip{cursor:pointer;text-align:left;font-size:12.5px}
.cin{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.cin textarea{flex:1;font:inherit;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;min-height:48px;resize:vertical}
@media (max-width:820px){.tpg{grid-template-columns:1fr}.tsum{position:static}}
.cur{display:flex;gap:8px;margin-top:10px}.cur input{flex:1}.pl.cu{cursor:default}.pl .x{margin-left:auto;background:transparent;color:var(--mu);border:0;padding:0 4px;font-size:13px}.pl.cu::after{content:none}
.nts{margin-top:16px}.tbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px;background:#F4F9F6;border:1px solid var(--ln);border-bottom:0;border-radius:12px 12px 0 0}.tbar select{width:auto;padding:4px 6px;font-size:13px}
.tbn,.tcl{background:#fff;color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:3px 8px;min-width:30px;height:30px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin:0}.tbn:hover,.tcl:hover{background:var(--tm)}
.tcl{position:relative;font-weight:700;overflow:hidden}.tcl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.ed{min-height:240px;background:#fff;border:1px solid var(--ln);border-radius:0 0 12px 12px;padding:16px 18px;outline:0;line-height:1.6;overflow:auto}.ed:focus{border-color:var(--g)}.ed:empty::before{content:attr(data-ph);color:#8A9A92}
.ed h1{font-size:26px;margin:.4em 0}.ed h2{font-size:21px;margin:.4em 0}.ed h3{font-size:17px;margin:.4em 0}.ed blockquote{border-left:4px solid var(--g);margin:.6em 0;padding-left:12px;color:var(--mu)}.ed table{border-collapse:collapse;width:100%}.ed td{border:1px solid #999;padding:6px}.ed ul,.ed ol{padding-left:24px}
#pnt{display:none}
@media (max-width:820px){.tpg{grid-template-columns:1fr}.tsum{position:static}}
@media print{header,footer,.tph2,.tpg,.nts{display:none!important}#pnt{display:block;font-family:Calibri,Arial,sans-serif}}

/* Passport */
.pph{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;background:linear-gradient(135deg,#fff 0%,#EAF6F0 65%,#E4F2FB 100%);border:1px solid var(--ln);border-radius:24px;padding:28px 30px;margin-bottom:18px;overflow:hidden}
.pph h2{font-size:clamp(32px,5vw,52px);font-weight:800;letter-spacing:-.8px;color:#0B3D31;margin:12px 0 8px;line-height:1.08}.pph h2 em{font-style:normal;background:linear-gradient(90deg,#0A7A58,#C0392B);-webkit-background-clip:text;background-clip:text;color:transparent}.pph p{color:var(--mu);max-width:500px;margin:0 0 14px}
.ppdl{display:inline-block;background:#fff;border:1px solid var(--ln);border-radius:99px;padding:6px 16px;font-size:14px;margin-bottom:14px}.ppdl b{color:var(--g)}

function bindKS(){var i=$("ks"),x=$("ksx"),st=$("ksr"),tm,last="";if(!i)return;
 var cards=function(){return[].slice.call(document.querySelectorAll("#svc .card"))},

 function isDistrict(q){return RG.some(function(r){var n=ksN(r[0]);return n.indexOf(q)===0||n.split(/\s+/).some(function(w){return w.length>2&&w.indexOf(q)===0})})}
 function apply(){var raw=i.value.trim(),q=ksN(raw).replace(/\s+/g," ");

  st.hidden=false;

 for(var y=0;y<H;y++)for(var x=0;x<W;x++){var k=y*W+x,id=255,j;
