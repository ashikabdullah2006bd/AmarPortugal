<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmarPortugal</title>
<style>
:root{color-scheme:light;--g:#0F6B4F;--gd:#0A4F3A;--bg:#F2F8F4;--wh:#fff;--ink:#1B2B25;--mu:#5F6F68;--ln:#D7E5DC;--tb:#EAF3FD;--to:#FFF3E0;--tp:#FDEEF3;--tm:#E6F5EC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}h1,h2,h3{margin:0;line-height:1.2}
.w{max-width:1040px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:9;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 18px;max-width:1040px;margin:0 auto;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;text-decoration:none;color:var(--g)}
.logo i{font-style:normal;background:var(--g);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:14px}
.nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.nav a{white-space:nowrap;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:99px;color:var(--mu)}
.nav a.on,.nav a:hover{background:var(--tm);color:var(--g)}
.act{display:flex;gap:8px;align-items:center}
.btn,button{font:inherit;font-weight:600;cursor:pointer;border:1.5px solid var(--g);background:var(--g);color:#fff;border-radius:99px;padding:7px 18px;text-decoration:none;display:inline-block;font-size:15px}
.btn.o,button.o{background:#fff;color:var(--g)}
select,input[type=text],input[type=email],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.act select{width:auto;padding:6px 8px}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.hero{padding:44px 0 30px;background:linear-gradient(180deg,#DDF1E5,var(--bg))}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(30px,5vw,46px)}.hero p{color:var(--mu);margin:12px 0 20px;max-width:48ch}.hero .btn+.btn{margin-left:8px}
.vid{aspect-ratio:16/10;border-radius:18px;background:linear-gradient(135deg,#1F8A66,#0F6B4F);display:grid;place-items:center;color:#fff;text-align:center;padding:12px;font-size:14px;box-shadow:0 8px 24px rgba(15,107,79,.18)}
.vid b{display:block;font-size:38px}
.s{padding:34px 0}h2{font-size:25px;margin-bottom:4px}.lead{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:block;border:1px solid var(--ln);border-radius:16px;padding:16px;text-decoration:none;background:var(--wh)}
.card:hover{border-color:var(--g)}.card h3{font-size:17px;margin-bottom:4px}.card p{margin:0;color:var(--mu);font-size:14px}
.go{background:var(--tb)}.book{background:var(--to)}.fun{background:var(--tp)}.info{background:var(--tm)}
.st{display:inline-block;margin-top:8px;font-size:12px;padding:2px 10px;border-radius:99px;background:#fff;color:var(--g);font-weight:600}
.ban{border:1px dashed #B9D4C5;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff}
.tag{font-size:12px;color:var(--mu)}
.bld{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;align-items:start}
.pn,.stg{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;background:#fff;color:var(--g);padding:7px 8px}.tabs button.on{background:var(--g);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--ln);background:var(--tm);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.cnt{font-weight:700;color:var(--g)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.th{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--ln)}.th.on{box-shadow:0 0 0 3px var(--g)}
canvas{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:12px;border:1px solid var(--ln);cursor:pointer}
.lnk{background:none;border:0;color:var(--g);text-decoration:underline;padding:0;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.pg{padding:30px 0;min-height:60vh}.box{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;max-width:520px}
ul.l{padding-left:20px}ul.l li{margin:5px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:120px}
.day{border-top:1px solid var(--ln);padding:10px 0}
.note{font-size:13px;color:var(--mu);margin-top:12px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.stamp{border:2px dashed #C8D6CD;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:14px;font-weight:700;font-size:14px;color:#9AA9A1;background:#fff;line-height:1.2}
.stamp.on{border:3px solid var(--g);color:var(--g);background:var(--tm);transform:rotate(-6deg)}
footer{background:#E6F2EA;border-top:1px solid var(--ln);padding:34px 0 20px;font-size:14px;color:var(--mu);margin-top:30px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
footer h4{margin:0 0 8px;color:var(--ink);font-size:14px}footer a{display:block;text-decoration:none;margin:4px 0}footer a:hover{color:var(--g)}
.pill{display:inline-block;border:1px solid #BBD3C4;background:#fff;border-radius:99px;padding:2px 10px;margin:0 6px 6px 0;font-size:12px}
.fb{border-top:1px solid #C9DDD0;margin-top:20px;padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
@media (max-width:820px){.hero .w,.bld{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}}
</style></head><body>
